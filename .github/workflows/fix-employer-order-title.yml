name: Apply employer order title fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Employer order title display
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/Employer.tsx')
          s = p.read_text()
          old_interface = """interface OrderItem {\n  id: string;\n  status: string;\n  total_price: number;\n  created_at: string;\n  job_prices?: { job_name: string } | null;\n  order_locations?: Array<{ lat: number | null; lng: number | null }>;\n}"""
          new_interface = """interface OrderItem {\n  id: string;\n  status: string;\n  total_price: number;\n  created_at: string;\n  title?: string | null;\n  job_prices?: { job_name: string } | null;\n  order_locations?: Array<{ lat: number | null; lng: number | null }>;\n}"""
          old_render = "{order.job_prices?.job_name || 'Pekerjaan'}"
          new_render = "{order.title || order.job_prices?.job_name || 'Pekerjaan'}"
          if old_interface not in s:
              raise SystemExit('Expected OrderItem interface was not found')
          if old_render not in s:
              raise SystemExit('Expected order title render expression was not found')
          s = s.replace(old_interface, new_interface, 1)
          s = s.replace(old_render, new_render, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/components/Employer.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Employer.tsx
          git commit -m 'fix: display actual employer order title' || exit 0
          git push
          rm -f .github/workflows/fix-employer-order-title.yml
          git add -A
          git commit -m 'chore: remove one-time order title patch workflow'
          git push
