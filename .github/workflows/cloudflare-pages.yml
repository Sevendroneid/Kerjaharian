name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: cloudflare-pages-production-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Assert checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${GITHUB_SHA}"
          test "${ACTUAL}" = "${EXPECTED}"
      - name: Assert Vercel-free repository
        shell: bash
        run: |
          set -euo pipefail
          test ! -e vercel.json
          test ! -e .vercel
          test ! -e api
          if git grep -n -i -E 'vercel\.app|vercel\.com|@vercel/' -- . ':!README.md' ':!.github/workflows/cloudflare-pages.yml' ':!.github/workflows/polish-user-auth-ui.yml'; then exit 1; fi
      - name: Simplify user auth UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/AuthModal.tsx'); s=p.read_text()
          replacements=[
          ('<div className="w-full max-w-md rounded-2xl bg-white shadow-xl">','<div className="w-full max-w-sm rounded-3xl bg-white shadow-2xl">'),
          ('<div className="flex items-center justify-between border-b px-5 py-4">','<div className="flex items-center justify-between px-5 pt-5">'),
          ('<div className="p-5">','<div className="px-5 pb-6 pt-4">'),
          ('<h2 className="text-xl font-bold text-slate-900">Masuk KerjaHarian</h2>\n          <p className="mt-1 text-sm text-slate-500">Login utama sama untuk Pekerja dan Pemberi Kerja.</p>\n          <div className="mt-4 rounded-xl border border-slate-200 bg-slate-50 p-3 text-xs text-slate-600"><b>PIN atau Fingerprint / Passkey.</b> WhatsApp OTP hanya dipakai saat pendaftaran/verifikasi nomor, bukan setiap login.</div>','<h2 className="text-2xl font-bold tracking-tight text-slate-900">Masuk</h2>\n          <p className="mt-1 text-sm text-slate-500">Masuk ke KerjaHarian</p>'),
          ('{loading ? \'Memverifikasi...\' : \'Masuk dengan PIN\'}','{loading ? \'Memverifikasi...\' : \'Masuk\'}'),
          ('{loading ? \'Menunggu biometrik...\' : \'Masuk dengan Fingerprint / Passkey\'}','{loading ? \'Menunggu...\' : \'Fingerprint\'}'),
          ('>Daftar akun baru</button>','>Daftar</button>')]
          for old,new in replacements:
              if old not in s: raise SystemExit(f'Missing expected UI fragment: {old[:80]}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        env:
          VITE_SUPABASE_URL: https://cgulvtbyqkixpxxqzcet.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_37nHNxKCf60GiWedu90g9g_DDetNzb9
        run: npm run build
      - name: Assert frontend Supabase configuration is present in build
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          ! grep -R -q "Missing Supabase environment variables" dist
      - name: Ensure Cloudflare Pages project exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 489c2e2b374c84561b5b510fa2136016
        run: |
          set -euo pipefail
          PROJECTS="$(npx --yes wrangler@4 pages project list)"
          if ! printf '%s' "$PROJECTS" | grep -q 'kerjaharian'; then npx --yes wrangler@4 pages project create kerjaharian --production-branch main; fi
      - name: Ensure Cloudflare Pages custom domains
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 489c2e2b374c84561b5b510fa2136016
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/kerjaharian/domains"
          domains=("kerjaharian.my.id" "www.kerjaharian.my.id")
          existing="$(curl --fail --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}")"
          for domain in "${domains[@]}"; do
            if ! printf '%s' "$existing" | jq -e --arg domain "$domain" '.result[]? | select(.name == $domain)' >/dev/null; then curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data "$(jq -cn --arg name "$domain" '{name:$name}')" "${api}" >/dev/null; fi
          done
      - name: Verify required payment secrets are configured before deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 489c2e2b374c84561b5b510fa2136016
        run: |
          set -euo pipefail
          secrets="$(npx --yes wrangler@4 pages secret list --project-name=kerjaharian)"
          for name in MIDTRANS_SERVER_KEY MIDTRANS_CLIENT_KEY SUPABASE_SERVICE_ROLE_KEY; do
            printf '%s' "$secrets" | grep -Eq "(^|[^A-Za-z0-9_])${name}([^A-Za-z0-9_]|$)" || { echo "Missing required Cloudflare Pages secret: ${name}"; exit 1; }
          done
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 489c2e2b374c84561b5b510fa2136016
          wranglerVersion: "4"
          command: pages deploy dist --project-name=kerjaharian --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
      - name: Verify Supabase Passkey endpoint is enabled
        shell: bash
        env:
          SUPABASE_URL: https://cgulvtbyqkixpxxqzcet.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_37nHNxKCf60GiWedu90g9g_DDetNzb9
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' -X POST -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" -H 'Content-Type: application/json' "${SUPABASE_URL}/auth/v1/passkeys/authentication/options")"
          cat "$response_file"
          test "$status" = "200"
      - name: Smoke test production endpoints
        shell: bash
        run: |
          set -euo pipefail
          for url in "https://kerjaharian.pages.dev/" "https://kerjaharian.my.id/" "https://www.kerjaharian.my.id/"; do curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 10 --max-time 30 -o /dev/null "$url"; done
      - name: Verify AI endpoints reject unauthenticated requests
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in ai-core ai-problem-solver ai-task-parser ai-worker-matcher ai-admin-insights ai-user-proactive ai-admin-voice ai-admin-transcribe ai-user ai-admin; do
            if [ "$endpoint" = "ai-admin-transcribe" ]; then
              status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -X POST -F 'audio=@/dev/null;filename=test.webm;type=audio/webm' "https://www.kerjaharian.my.id/api/${endpoint}")"
            else
              status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' "https://www.kerjaharian.my.id/api/${endpoint}")"
            fi
            echo "${endpoint}: HTTP ${status}"
            test "$status" = "401"
          done