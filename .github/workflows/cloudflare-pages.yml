name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: cloudflare-pages-production-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Assert checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${GITHUB_SHA}"
          echo "Deploying commit: ${ACTUAL}"
          echo "GitHub event SHA: ${EXPECTED}"
          test "${ACTUAL}" = "${EXPECTED}"

      - name: Assert Vercel-free repository
        shell: bash
        run: |
          set -euo pipefail
          test ! -e vercel.json
          test ! -e .vercel
          test ! -e api
          if git grep -n -i -E 'vercel\.app|vercel\.com|@vercel/' -- . ':!README.md' ':!.github/workflows/cloudflare-pages.yml'; then
            echo "Vercel references detected in tracked source/configuration."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          VITE_SUPABASE_URL: https://cgulvtbyqkixpxxqzcet.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_37nHNxKCf60GiWedu90g9g_DDetNzb9
        run: npm run build

      - name: Assert frontend Supabase configuration is present in build
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          if grep -R -q "Missing Supabase environment variables" dist; then
            echo "Frontend build still contains the missing-Supabase runtime failure."
            exit 1
          fi
          echo "Frontend Supabase configuration was embedded during the production build."

      - name: Ensure Cloudflare Pages project exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 489c2e2b374c84561b5b510fa2136016
        run: |
          set -euo pipefail
          PROJECTS="$(npx --yes wrangler@4 pages project list)"
          if printf '%s' "$PROJECTS" | grep -q 'kerjaharian'; then
            echo "Cloudflare Pages project kerjaharian already exists."
          else
            echo "Cloudflare Pages project kerjaharian not found. Creating it on production branch main."
            npx --yes wrangler@4 pages project create kerjaharian --production-branch main
          fi

      - name: Ensure Cloudflare Pages custom domains
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 489c2e2b374c84561b5b510fa2136016
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/kerjaharian/domains"
          domains=("kerjaharian.my.id" "www.kerjaharian.my.id")
          existing="$(curl --fail --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}")"
          for domain in "${domains[@]}"; do
            if printf '%s' "$existing" | jq -e --arg domain "$domain" '.result[]? | select(.name == $domain)' >/dev/null; then
              echo "Pages custom domain already configured: ${domain}"
            else
              response="$(curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data "$(jq -cn --arg name "$domain" '{name:$name}')" "${api}")"
              printf '%s' "$response" | jq -e '.success == true' >/dev/null
            fi
          done
          for attempt in $(seq 1 18); do
            current="$(curl --fail --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}")"
            ready=true
            for domain in "${domains[@]}"; do
              status="$(printf '%s' "$current" | jq -r --arg domain "$domain" '.result[]? | select(.name == $domain) | .status // "missing"' | head -n1)"
              echo "${domain}: ${status:-missing}"
              if [ "$status" != "active" ]; then ready=false; fi
            done
            if [ "$ready" = true ]; then echo "Cloudflare Pages custom domains are active."; exit 0; fi
            if [ "$attempt" -lt 18 ]; then sleep 10; fi
          done
          exit 1

      - name: Assert payments remain disabled
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 489c2e2b374c84561b5b510fa2136016
        run: |
          set -euo pipefail
          secrets="$(npx --yes wrangler@4 pages secret list --project-name=kerjaharian)"
          if printf '%s' "$secrets" | grep -Eq 'MIDTRANS_SERVER_KEY|MIDTRANS_CLIENT_KEY'; then
            echo "Payment configuration detected. This project must remain Rp0 with payments disabled."
            exit 1
          fi
          echo "Midtrans payment secrets are not configured; payment remains disabled."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 489c2e2b374c84561b5b510fa2136016
          wranglerVersion: "4"
          command: pages deploy dist --project-name=kerjaharian --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true

      - name: Verify Supabase Passkey endpoint is enabled
        shell: bash
        env:
          SUPABASE_URL: https://cgulvtbyqkixpxxqzcet.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_37nHNxKCf60GiWedu90g9g_DDetNzb9
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' -X POST -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" -H 'Content-Type: application/json' "${SUPABASE_URL}/auth/v1/passkeys/authentication/options")"
          echo "Supabase passkey options HTTP status: ${status}"
          cat "$response_file"
          test "$status" = "200"

      - name: Smoke test production endpoints
        shell: bash
        run: |
          set -euo pipefail
          urls=("https://kerjaharian.pages.dev/" "https://kerjaharian.my.id/" "https://www.kerjaharian.my.id/")
          for url in "${urls[@]}"; do
            echo "Checking ${url}"
            curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 10 --max-time 30 -o /dev/null "${url}"
          done
          echo "Production endpoint smoke tests passed."
