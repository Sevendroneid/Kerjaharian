name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Assert checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${GITHUB_SHA}"
          echo "Deploying commit: ${ACTUAL}"
          echo "GitHub event SHA: ${EXPECTED}"
          test "${ACTUAL}" = "${EXPECTED}"

      - name: Assert Vercel-free repository
        shell: bash
        run: |
          set -euo pipefail
          test ! -e vercel.json
          test ! -e .vercel
          test ! -e api
          if git grep -n -i -E 'vercel\.app|vercel\.com|@vercel/' -- . ':!README.md' ':!.github/workflows/cloudflare-pages.yml'; then
            echo "Vercel references detected in tracked source/configuration."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Ensure Cloudflare Pages project exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 489c2e2b374c84561b5b510fa2136016
        run: |
          set -euo pipefail
          PROJECTS="$(npx --yes wrangler@3.90.0 pages project list --json)"
          if printf '%s' "$PROJECTS" | grep -q '"name"[[:space:]]*:[[:space:]]*"kerjaharian"'; then
            echo "Cloudflare Pages project kerjaharian already exists."
          else
            echo "Cloudflare Pages project kerjaharian not found. Creating it on production branch main."
            npx --yes wrangler@3.90.0 pages project create kerjaharian --production-branch main
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 489c2e2b374c84561b5b510fa2136016
          command: pages deploy dist --project-name=kerjaharian --branch=main --commit-hash=${{ github.sha }} --commit-message="${{ github.event.head_commit.message }}"
