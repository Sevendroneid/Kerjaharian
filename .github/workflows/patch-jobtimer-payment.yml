name: Patch JobTimer payment UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch JobTimer
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/JobTimer.tsx')
          s = p.read_text()

          if "import { payCompletedJob } from '@/lib/midtrans';" not in s:
              s = s.replace(
                  "import { formatIDR } from '@/lib/format';",
                  "import { formatIDR } from '@/lib/format';\nimport { payCompletedJob } from '@/lib/midtrans';"
              )

          if "const [payingId, setPayingId]" not in s:
              s = s.replace(
                  "const [photoJobId, setPhotoJobId] = useState<string | null>(null);",
                  "const [photoJobId, setPhotoJobId] = useState<string | null>(null);\n  const [payingId, setPayingId] = useState<string | null>(null);"
              )

          if "const payCompleted = async (jobId: string)" not in s:
              marker = "  const openNavigation = (job: WorkflowJob) => {"
              fn = """  const payCompleted = async (jobId: string) => {\n    setPayingId(jobId); setError('');\n    try {\n      await payCompletedJob(jobId, () => { void load(); }, () => { void load(); });\n    } catch (cause) {\n      setError(cause instanceof Error ? cause.message : 'Gagal membuka pembayaran.');\n    } finally {\n      setPayingId(null);\n    }\n  };\n\n"""
              if marker not in s:
                  raise SystemExit('JobTimer payment insertion marker not found')
              s = s.replace(marker, fn + marker, 1)

          marker = "            {role === 'worker' && job.status !== 'completed' && !job.started_at && ("
          block = """            {role === 'employer' && job.status === 'completed' && (\n              <div className=\"mt-4 rounded-xl bg-white p-4 ring-1 ring-slate-200\">\n                <div className=\"flex items-center justify-between gap-3\">\n                  <div>\n                    <p className=\"text-sm font-bold text-slate-900\">Pembayaran</p>\n                    <p className=\"mt-1 text-xs text-slate-500\">Total: {formatIDR(finalAmount)}</p>\n                  </div>\n                  <span className={`rounded-full px-2.5 py-1 text-[11px] font-bold ${job.payment_status === 'settled' ? 'bg-success-50 text-success-700' : 'bg-warning-50 text-warning-700'}`}>\n                    {job.payment_status === 'settled' ? 'SUDAH DIBAYAR' : 'BELUM DIBAYAR'}\n                  </span>\n                </div>\n                {job.payment_status !== 'settled' && job.payment_status !== 'refunded' && job.payment_status !== 'partial_refund' && (\n                  <button\n                    onClick={() => void payCompleted(job.id)}\n                    disabled={payingId === job.id}\n                    className=\"mt-3 flex w-full items-center justify-center gap-2 rounded-lg bg-primary-600 px-3 py-2.5 text-sm font-bold text-white disabled:opacity-60\"\n                  >\n                    {payingId === job.id ? 'Membuka pembayaran…' : `Bayar ${formatIDR(finalAmount)}`}\n                  </button>\n                )}\n                {job.payment_status === 'pending' && <p className=\"mt-2 text-[11px] text-slate-500\">Pembayaran sedang diproses. Status akan diperbarui otomatis setelah konfirmasi Midtrans.</p>}\n              </div>\n            )}\n\n"""
          if "Membuka pembayaran…" not in s:
              if marker not in s:
                  raise SystemExit('JobTimer JSX insertion marker not found')
              s = s.replace(marker, block + marker, 1)

          p.write_text(s)
      - name: Verify
        run: |
          grep -q "payCompletedJob" src/components/JobTimer.tsx
          grep -q "Membuka pembayaran" src/components/JobTimer.tsx
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/JobTimer.tsx
          if git diff --cached --quiet; then
            echo "No patch needed"
          else
            git commit -m "Wire completed job payment UI"
            git push
          fi
      - name: Remove patch workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/patch-jobtimer-payment.yml
          git commit -m "Remove one-time payment UI patch workflow"
          git push
