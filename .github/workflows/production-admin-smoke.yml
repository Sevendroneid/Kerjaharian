name: Production Admin Smoke

on:
  workflow_run:
    workflows: [Deploy to Cloudflare Pages]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: production-admin-smoke
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Verify deployment event is successful and current
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          deployment_conclusion="${{ github.event.workflow_run.conclusion }}"
          deployed_sha="${{ github.event.workflow_run.head_sha }}"
          current_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "Deployment conclusion: ${deployment_conclusion}"
          echo "Deployment commit: ${deployed_sha}"
          echo "Current main commit: ${current_sha}"
          test "${deployment_conclusion}" = "success"
          test "${deployed_sha}" = "${current_sha}"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Playwright runtime and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium

      - name: Verify production admin route and authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const otp=[];
          const errors=[];
          page.on('request', r => { if (r.url().includes('phone-auth-otpid') || r.url().includes('/api/phone-auth-otpid')) otp.push(r.url()); });
          page.on('pageerror', e => errors.push(String(e)));
          const response = await page.goto('https://www.kerjaharian.my.id/rahasia',{waitUntil:'domcontentloaded',timeout:60000});
          if (!response || !response.ok()) throw new Error(`Admin route HTTP failure: ${response?.status() ?? 'no response'}`);
          if (page.url() !== 'https://www.kerjaharian.my.id/rahasia') throw new Error(`Unexpected admin origin: ${page.url()}`);
          await page.getByText('Login Admin',{exact:true}).waitFor({state:'visible',timeout:20000});
          await page.getByText('Masuk dengan PIN',{exact:true}).waitFor({state:'visible',timeout:10000});
          await page.waitForTimeout(1000);
          const body=await page.locator('body').innerText();
          if (body.includes('Memverifikasi sesi Admin...')) throw new Error('Admin route is stuck on session verification');
          if (body.includes('Kirim Kode WhatsApp') || body.includes('Kirim OTP') || body.includes('Verifikasi OTP')) throw new Error('WhatsApp OTP UI rendered on admin route');
          if (!body.includes('Masuk dengan Fingerprint / Passkey')) throw new Error('Admin Passkey login missing');
          if (otp.length) throw new Error('OTP endpoint called: '+otp.join(','));
          if (errors.length) throw new Error('Browser page errors: '+errors.join(' | '));
          console.log('REAL-WORLD ADMIN AUTH UI VERIFICATION PASSED');
          console.log('HTTP status:', response.status());
          console.log('Canonical admin origin:', page.url());
          console.log('PIN login UI: present');
          console.log('Passkey login UI: present');
          console.log('OTP requests: 0');
          console.log('Browser page errors: 0');
          await browser.close();
          EOF
