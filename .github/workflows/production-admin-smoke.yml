name: Production Admin Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Verify production admin preview
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const otp=[];
          const errors=[];
          page.on('request', r => { if (r.url().includes('phone-auth-otpid') || r.url().includes('/api/phone-auth-otpid')) otp.push(r.url()); });
          page.on('pageerror', e => errors.push(String(e)));
          await page.goto('https://kerjaharian.my.id/rahasia',{waitUntil:'networkidle',timeout:60000});
          await page.waitForTimeout(2000);
          const body=await page.locator('body').innerText();
          if(!body.includes('KerjaHarian Command Center')) throw new Error('Admin panel did not render');
          if(body.includes('Memverifikasi')) throw new Error('Verification screen still rendered');
          if(body.includes('Kirim OTP') || body.includes('Verifikasi OTP')) throw new Error('OTP UI still rendered');
          if(otp.length) throw new Error('OTP endpoint called: '+otp.join(','));
          if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));
          console.log('REAL-WORLD ADMIN PREVIEW VERIFICATION PASSED');
          console.log('OTP requests: 0');
          console.log('Browser page errors: 0');
          await browser.close();
          EOF
          node /tmp/check.mjs
