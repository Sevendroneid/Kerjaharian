  <!-- Modern Styling (Clean, Light-Theme Forced for Consistent Local Editor View) -->
  <style>
    :root {
      --primary: #1a73e8;
      --primary-dark: #1557b0;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-main: #202124;
      --text-muted: #5f6368;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 600px;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background-color: #e8f0fe;
      color: var(--primary);
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 20px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 28px;
      color: var(--text-main);
      margin-bottom: 15px;
    }
    h1 span {
      color: var(--primary);
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 30px;
    }
    .cta-container {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      text-decoration: none;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-primary {
      background-color: var(--primary);
      color: white;
    }
    .btn-primary:hover {
      background-color: var(--primary-dark);
    }
    .btn-outline {
      background-color: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
    }
    .btn-outline:hover {
      background-color: #e8f0fe;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Platform Terverifikasi Google</div>
    <h1>Kerja<span>Harian</span></h1>
    <p>Platform pencarian kerja harian yang mereduksi jarak dan waktu, menghubungkan pemberi kerja langsung dengan tenaga kerja fisik terdekat secara real-time, aman, dan transparan.</p>
    
    <div class="cta-container">
      <a href="#cari-pekerja" class="btn btn-primary">Cari Pekerja Sekarang</a>
      <a href="#daftar-mitra" class="btn btn-outline">Gabung Jadi Mitra</a>
    </div>
  </div>

</body>
</html>
